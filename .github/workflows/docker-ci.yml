name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build backend image
      - name: Build Backend Image
        run: docker build -t $DOCKER_USER/sistemagdp-backend:latest ./backend

      # Build frontend image
      - name: Build Frontend Image
        run: docker build -t $DOCKER_USER/sistemagdp-frontend:latest ./frontend

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push images
      - name: Push Docker Images
        run: |
          docker push $DOCKER_USER/sistemagdp-backend:latest
          docker push $DOCKER_USER/sistemagdp-frontend:latest